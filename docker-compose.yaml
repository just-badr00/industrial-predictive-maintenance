name: cmapss-platform

x-airflow-common: &airflow-common
  image: cmapss-airflow:3.3.1

  build:
    context: ./airflow

  env_file:
    - .env

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: cmapss-local-development-shared-key
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: badr:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_passwords.json
    PYTHONPATH: /opt/cmapss
    MINIO_ENDPOINT: http://minio:9000
    PREDICTION_API_URL: http://api:8000

  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - .:/opt/cmapss:ro

  depends_on:
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully
services:
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"

    volumes:
      - minio-data:/data

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: maintenance-api:latest

    build:
      context: .
      dockerfile: api/Dockerfile

    environment:
      MODEL_DIRECTORY: /model

    ports:
      - "127.0.0.1:8001:8000"

    volumes:
      - ./output/serving_model:/model:ro

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s


  mlflow:
    image: maintenance-mlflow:latest

    build:
      context: ./mlflow

    ports:
      - "127.0.0.1:5001:5000"

    volumes:
      - .:/opt/cmapss:ro
      - ./output/docker_mlflow:/opt/cmapss/output/docker_mlflow

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  streamlit:
    image: maintenance-dashboard:latest

    build:
      context: ./dashboard

    env_file:
      - .env

    environment:
      PROJECT_ROOT: /opt/cmapss
      PREDICTION_API_URL: http://api:8000
      MINIO_ENDPOINT: http://minio:9000
      MLFLOW_TRACKING_URI: http://mlflow:5000

    ports:
      - "127.0.0.1:8502:8501"

    volumes:
      - .:/opt/cmapss:ro

    depends_on:
      api:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      minio:
        condition: service_started

  airflow-init:
    <<: *airflow-common
    command: db migrate

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server

    ports:
      - "127.0.0.1:8081:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor

volumes:
  minio-data:
    external: true
    name: minio_cmapss_data

  postgres-data:
    external: true
    name: cmapss-airflow_postgres-data
