name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Download project files
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Check Python code
        run: python -m ruff check --select F821,F823 src tests dashboard airflow/dags

      - name: Run tests
        run: python -m pytest tests -q
